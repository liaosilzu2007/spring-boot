
logging.level.com.lzumetal.springboot.mybatis.mapper=debug
logging.level.org.apache.ibatis=debug
logging.level.com.mysql.cj=debug


spring.jackson.time-zone=GMT+8




mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.lzumetal.springboot.mybatis.entity


# 配置 useSSL=false 原因：较新版本的MySQL默认使用SSL协议连接，需要服务器证书验证才能连接成功
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/test_db?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver





