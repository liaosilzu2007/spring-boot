server:
  port: 8081

spring:
  application:
    name: local-grpc-client

logging:
  config: classpath:logback.xml

grpc:
  client:
    local-grpc-client:            # gRPC配置的名字，GrpcClient注解会用到，对应 @GrpcClient("local-grpc-server")
      # gRPC服务端地址，支持三种scheme：static（静态直连）、dns（DNS解析）、discovery（通过注册中心动态发现）
      address: 'static://127.0.0.1:9091'
      # 是否启用长连接
      enableKeepAlive: true
      # 是否在没有调用的情况下也保持长连接
      keepAliveWithoutCalls: true
      # 长连接类型，可选值：plaintext、https。plaintext表示明文连接（不加密）
      negotiationType: plaintext
      # 最大接收消息大小，默认 4MB，传输大文件时需调大
      maxInboundMessageSize: 10485760   # 10MB
      # Keep-Alive Ping 间隔，默认 5 分钟
      keepAliveTime: 1m
      # Keep-Alive Ping 超时，默认 20 秒
      keepAliveTimeout: 10s
      # 默认 RPC 调用超时
      deadline: 30s
